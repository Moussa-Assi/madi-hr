<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mut:#6b7280;--line:#e5e7eb;--pri:#1F3864;--pri2:#2f5597;
--ok:#1e8e3e;--okb:#e6f4ea;--late:#b06000;--lateb:#fef3e0;--bad:#c5221f;--badb:#fce8e6;--chk:#7b1fa2;--chkb:#f3e5f5;--inf:#1967d2;--infb:#e8f0fe;--off:#5f6368;--offb:#f1f3f4}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600;flex:1}
.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:4px 10px;cursor:pointer;font-weight:600}
.lang button.on{background:#fff;color:var(--pri)}
nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:48px;z-index:4}
nav button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
nav button.on{background:var(--infb);color:var(--pri)}
nav .badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
main{padding:16px;max-width:1200px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.muted{color:var(--mut);font-size:12px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--line)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;background:#fff;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:2px}
.kpi.ok b{color:var(--ok)}.kpi.late b{color:var(--late)}.kpi.bad b{color:var(--bad)}.kpi.chk b{color:var(--chk)}.kpi.inf b{color:var(--inf)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.card h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#fafbfc;font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0}
.click{cursor:pointer}tr.click:hover td{background:#f8fafc}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.s-ok{background:var(--okb);color:var(--ok)}.s-late{background:var(--lateb);color:var(--late)}.s-bad{background:var(--badb);color:var(--bad)}
.s-chk{background:var(--chkb);color:var(--chk)}.s-inf{background:var(--infb);color:var(--inf)}.s-off{background:var(--offb);color:var(--off)}
.pend{display:grid;gap:10px}
.pc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--chk);border-radius:8px;padding:12px;display:grid;gap:8px}
.pc .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pc textarea{width:100%;min-height:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hb{display:flex;align-items:center;gap:8px;padding:6px 14px}
.hb .l{width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{flex:1;background:var(--offb);border-radius:4px;height:14px;overflow:hidden}
.hb .f{height:100%;background:var(--pri2)}
.hb .v{width:60px;text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding:12px 14px}
.cols div{flex:1;background:var(--bad);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.cols div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:10;overflow:auto}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:0 0 12px}
.mbox .mh{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.mbox .mh h2{margin:0;font-size:16px;flex:1}
.mbox .mh .x{border:0;background:none;font-size:20px;cursor:pointer}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:12px 14px}
.info div{background:var(--bg);border-radius:6px;padding:8px}
.info small{display:block;color:var(--mut);font-size:11px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:14px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.form .full{grid-column:1/-1}
.form .act{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.inline{background:var(--bg);border-radius:8px;margin:12px 14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.load{padding:40px;text-align:center;color:var(--mut)}
.err{background:var(--badb);color:var(--bad);padding:10px 14px;border-radius:8px;margin-bottom:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:20}
.alertbar{background:var(--bad);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.alertbar button{background:#fff;color:var(--bad);border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.newp{border-left-color:var(--bad)!important}
.gridt td.c{padding:3px 4px;font-size:11px;text-align:center;min-width:46px;border-left:1px solid #fff}
.gridt th.c{padding:4px;font-size:10px;text-align:center;min-width:46px}
.gridt td.nm{position:sticky;left:0;background:#fff;z-index:1;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.c-ok{background:var(--okb)}.c-late{background:var(--lateb)}.c-bad{background:var(--badb);color:var(--bad);font-weight:700}.c-chk{background:var(--chkb);color:var(--chk);font-weight:700}.c-inf{background:var(--infb)}.c-off{background:var(--offb);color:var(--off)}
@media print{header,nav,#alert,.noprint,.toast{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{border:0}.gridt td.c,.gridt th.c{min-width:0;font-size:8px;padding:1px}.gridt td,.gridt th{font-size:9px;padding:2px 3px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media print{body.pm main,body.pm header,body.pm nav,body.pm #alert{display:none!important}body.pm .modal{position:static;display:block;background:#fff;padding:0;overflow:visible}body.pm .mbox{max-width:none;border-radius:0}body.pm .mh .x,body.pm .mh #mActs,body.pm .noprint{display:none!important}body.pm .rep td,body.pm .rep th{font-size:10px;padding:3px 5px}}
.rep td{vertical-align:top}.sig{display:flex;gap:40px;padding:30px 14px 10px}.sig div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:12px;text-align:center}
@media(max-width:700px){.grid2{grid-template-columns:1fr}header h1{font-size:14px}main{padding:12px}.hb .l{width:100px}}
#ltr{display:none}@media print{body.ltrm>*:not(#ltr){display:none!important}body.ltrm #ltr{display:block!important}body.ltrm{background:#fff;margin:0;padding:0}}.lt{width:100%;max-width:182mm;min-height:268mm;margin:0 auto;padding:4mm 6mm;box-sizing:border-box;font-family:Georgia,"Times New Roman",serif;color:#111;font-size:12.5pt;line-height:1.55;position:relative;page-break-after:always;background:#fff}.lt .lh{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1F3864;padding-bottom:8px}.lt .lh img{height:20mm;max-width:45mm;object-fit:contain}.lt .lh .le{font-family:Arial,sans-serif;font-size:9.5pt;line-height:1.35;color:#333}.lt .lh .le b{font-size:12pt;color:#111}.lt .lr{display:flex;justify-content:space-between;margin:9mm 0 6mm;font-family:Arial,sans-serif;font-size:11pt}.lt .lr b{font-family:"Courier New",monospace;font-size:13pt;letter-spacing:.5px}.lt h2{font-size:15pt;letter-spacing:.5px;margin:0 0 6mm;text-align:center}.lt p{margin:0 0 4mm;text-align:justify}.lt table{border-collapse:collapse;margin:3mm 0 6mm;min-width:95mm}.lt td{border:1px solid #888;padding:2mm 4mm;font-size:11.5pt}.lt td.v{text-align:right;font-weight:700;font-family:Arial,sans-serif}.lt .ld{margin:8mm 0 18mm}.lt .ls{display:flex;gap:16mm}.lt .ls div{flex:1;border-top:1px solid #111;padding-top:2mm;text-align:center;font-size:10.5pt;font-family:Arial,sans-serif}.lt .lq{position:absolute;right:6mm;bottom:4mm;text-align:center;font-family:"Courier New",monospace;font-size:10pt}.lt .lq svg,.lt .lq img{width:26mm;height:26mm;display:block;margin:0 auto 1mm}.lt .lf{position:absolute;left:6mm;bottom:5mm;font-family:Arial,sans-serif;font-size:8pt;color:#666;max-width:120mm}.ltrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ltrow label.btn{cursor:pointer}.ltrow input[type=file]{display:none}.ocrbox{margin-top:6px}.ocr{border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55}.ocr.good{background:#e8f6ee;border:1px solid #9bd3b2}.ocr.bad{background:#fdecec;border:1px solid #f0a9a9}.ocr small{display:block;margin-top:4px}
.dash .dsec h3{font-size:15px}.dash th.n{text-align:right}.dash .kpis{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}.dash .kpi{padding:10px 12px}.dash .kpi b{font-size:22px}.dash .how{padding:8px 14px;font-size:12px;color:var(--mut);background:#fafbfc;border-bottom:1px solid var(--line);line-height:1.5}.dash h4{margin:12px 14px 4px;font-size:13px}.dash h4.bad{color:var(--bad)}.dash h4.late{color:var(--late)}.dash h4.inf{color:var(--inf)}.dash h4.ok{color:var(--ok)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.dash .hb .rk{width:18px;color:var(--mut);font-size:12px;text-align:right}.dash .hb .l{width:170px}.dash .hb .v{width:auto;min-width:60px;font-size:12px;white-space:nowrap}.hb .f.bad{background:var(--bad)}.hb .f.late{background:var(--late)}.hb .f.inf{background:var(--inf)}.dash table td,.dash table th{padding:6px 10px}.dash tr.flag td{background:#fff8ec}.cbad{color:var(--bad)}.clate{color:var(--late)}.warnline{margin:4px 14px 12px;padding:8px 10px;border-radius:8px;background:#fff8ec;color:#8a5a00;font-size:13px}.wk{display:flex;align-items:flex-end;gap:8px;height:150px;padding:10px 14px 4px}.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.wk .wb{width:100%;background:var(--bad);border-radius:4px 4px 0 0;min-height:2px}.wk .wv{font-size:12px;font-weight:600;margin-bottom:2px}.wk .wl{font-size:11px;color:var(--mut);margin-top:4px}.kpi small{display:block;margin-top:2px}
@media (max-width:820px){.grid3{grid-template-columns:1fr}.dash .hb .l{width:120px}}
.colg{vertical-align:middle;margin-right:6px;object-fit:contain}.chip .colg{margin:-3px 6px -3px 0}
/* full width; every table scrolls inside its own box (max one screen high): titles stay frozen at the top and the sideways scroll bar is always on screen */
main{max-width:none!important;padding:16px 20px}
.tw{overflow:auto;max-height:calc(100vh - 150px);overscroll-behavior:contain}
.tw table{border-collapse:separate;border-spacing:0}
.tw th{position:sticky;top:0;z-index:3;background:#f1f3f6;box-shadow:inset 0 -1px 0 var(--line)}
.tw::-webkit-scrollbar{height:14px;width:12px}.tw::-webkit-scrollbar-thumb{background:#9aa3b2;border-radius:8px;border:3px solid #f1f3f6}.tw::-webkit-scrollbar-track{background:#f1f3f6}
/* attendance grid: name column not frozen, wider */
.gridt td.nm{position:static!important;min-width:230px;white-space:nowrap}
.gridt tr > th:first-child{min-width:230px;text-align:left}
@media(max-width:700px){main{padding:10px}.tw{max-height:calc(100vh - 120px)}.gridt td.nm,.gridt tr > th:first-child{min-width:160px}}
@media print{.tw{max-height:none!important;overflow:visible!important}.tw th{position:static!important;box-shadow:none}}
#main .tw th,#mBody .tw th{cursor:pointer;user-select:none}#main .tw th:hover{background:#e7eaf0}
.lt .lnota{font-size:12px;margin-top:10px}
.kpi.kclick{cursor:pointer;transition:transform .08s}.kpi.kclick:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}.kpi.kon{outline:2px solid #1F3864;outline-offset:-2px}
</style>

<script>
/* Login with Supabase (email + password). After login the app below starts with a short-lived pass that renews itself. */
const SB_URL = 'https://erxlksuoplobtfbsvypg.supabase.co', SB_PK = 'sb_publishable_M5dLHCm5GFfgzP0g0Ol9lQ_3vjLme_l', FN_URL = SB_URL + '/functions/v1/rh-api';
/* signed in only while the app is open: closing it signs out (session kept in sessionStorage, never on disk) */
try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token$/.test(k) || k === 'rh_atok').forEach(k => localStorage.removeItem(k)); } catch (e) {}
const sbc = supabase.createClient(SB_URL, SB_PK, { auth: { persistSession: true, autoRefreshToken: true, storage: window.sessionStorage } });
let TOK = '', STARTED = false;
sbc.auth.onAuthStateChange((ev, s) => { TOK = s ? s.access_token : ''; if (ev === 'SIGNED_OUT' && STARTED) location.reload(); });
function showLogin(err) { document.getElementById('login').style.display = 'flex'; document.getElementById('lg_err').textContent = err || ''; }
async function startApp(session) {
  TOK = session.access_token;
  let me;
  try { me = await fetch(FN_URL + '?a=me', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: TOK, action: '__me' }) }).then(r => r.json()); }
  catch (e) { return showLogin('Sem ligação · No connection'); }
  if (me.error) { await sbc.auth.signOut(); return showLogin(me.error); }
  window.ROLE = me.role; window.KEY = ''; window.V2 = { url: FN_URL, get token() { return TOK; } };
  if (me.role === 'assistant') { window.ASSIST = { user: me.nome, pin: '' }; try { sessionStorage.removeItem('rh_assist'); } catch (e) {} }
  document.getElementById('login').style.display = 'none';
  STARTED = true;
  const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
  if (me.role === 'assistant') { window.ASSIST = { user: me.nome, pin: '' }; window.assistLogout = () => sbc.auth.signOut(); }
  const h = document.querySelector('header .lang');
  if (h) { const b = document.createElement('button'); b.textContent = '⎋'; b.title = 'Sair · Sign out'; b.style.cssText = 'background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer'; b.onclick = () => sbc.auth.signOut(); h.parentNode.insertBefore(b, h.nextSibling); }
}
async function doLogin(e) {
  e.preventDefault();
  const b = document.getElementById('lg_b'); b.disabled = true; document.getElementById('lg_err').textContent = '';
  const { data, error } = await sbc.auth.signInWithPassword({ email: document.getElementById('lg_e').value.trim(), password: document.getElementById('lg_p').value });
  b.disabled = false;
  if (error) return showLogin(/invalid/i.test(error.message) ? 'Email ou palavra-passe errados · Wrong email or password' : error.message);
  startApp(data.session); return false;
}
function lmode(m) {
  document.getElementById('lt_m').classList.toggle('on', m === 'm'); document.getElementById('lt_a').classList.toggle('on', m === 'a');
  document.getElementById('lgf_m').style.display = m === 'm' ? '' : 'none'; document.getElementById('lgf_a').style.display = m === 'a' ? '' : 'none';
  try { localStorage.setItem('rh_lmode', m); } catch (e) {}
  if (m === 'a' && !document.getElementById('la_n').options.length) fetch(FN_URL + '?a=names', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: '__assistNames' }) }).then(r => r.json()).then(j => {
    document.getElementById('la_n').innerHTML = (j.names || []).map(n => '<option>' + n.replace(/</g, '&lt;') + '</option>').join('');
    try { const last = localStorage.getItem('rh_lname'); if (last) document.getElementById('la_n').value = last; } catch (e) {}
  });
}
function startAssist(tok, nome) {
  window.ROLE = 'assistant'; window.KEY = ''; window.V2 = { url: FN_URL, token: tok }; window.ASSIST = { user: nome, pin: '' };
  try { sessionStorage.removeItem('rh_assist'); } catch (e) {}
  document.getElementById('login').style.display = 'none'; STARTED = true;
  const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
  window.ASSIST = { user: nome, pin: '' };
  window.assistLogout = () => { try { sessionStorage.removeItem('rh_atok'); } catch (e) {} location.reload(); };
}
async function doAssist(e) {
  e.preventDefault();
  const b = document.getElementById('la_b'), nome = document.getElementById('la_n').value; b.disabled = true; document.getElementById('la_err').textContent = '';
  try {
    const j = await fetch(FN_URL + '?a=alogin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: '__assistLogin', user: nome, pin: document.getElementById('la_p').value }) }).then(r => r.json());
    if (j.error) throw j.error;
    try { sessionStorage.setItem('rh_atok', JSON.stringify({ t: j.token, n: j.nome, e: Date.now() + 11.5 * 3600e3 })); localStorage.setItem('rh_lname', nome); } catch (x) {}
    startAssist(j.token, j.nome);
  } catch (x) { document.getElementById('la_err').textContent = String(x); b.disabled = false; }
  return false;
}
(function boot() {
  try { const a = JSON.parse(sessionStorage.getItem('rh_atok') || 'null'); if (a && a.e > Date.now()) return startAssist(a.t, a.n); } catch (e) {}
  sbc.auth.getSession().then(({ data }) => {
    if (data.session) return startApp(data.session);
    showLogin(); let m = 'm'; try { m = localStorage.getItem('rh_lmode') || 'm'; } catch (e) {} lmode(m);
  });
})();
</script>

function call(action, p) {
  const P = Object.assign({}, p || {}, { key: window.KEY || '', user: (window.ASSIST || {}).user || '', pin: (window.ASSIST || {}).pin || '' });
  if (window.V2) { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 45000);

    .then(r => { clearTimeout(tm); return r.json(); }).catch(() => { throw (LANG === 'pt' ? 'Sem ligação — tente de novo' : 'No connection — try again'); }).then(d => { if (d && d.error) throw d.error; return d; }); }

    .withSuccessHandler(s => { const d = JSON.parse(s); d && d.error ? rej(d.error) : res(d); })
    .withFailureHandler(e => rej(e && e.message || e)).api(action, P));
}

}
async function pwSave() {
  const pt = LANG === 'pt', a = val('pw1'), b = val('pw2');
  if (a.length < 8) return toast(pt ? 'Mínimo 8 caracteres' : 'At least 8 characters');
  if (a !== b) return toast(pt ? 'As palavras-passe não coincidem' : 'Passwords do not match');
  document.getElementById('pwb').disabled = true;
  try {
    const r = await fetch(window.V2.url + '?a=pw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: window.V2.token, action: '__setPassword', password: a }) }).then(x => x.json());
    if (r.error) throw r.error;
    closeModal(); toast((pt ? 'Palavra-passe guardada para ' : 'Password saved for ') + r.email);
  } catch (e) { toast(String(e)); document.getElementById('pwb').disabled = false; }
}

window.addEventListener('error', e => { try { toast('Error: ' + e.message); } catch (_) {} });
/* files kept in Supabase Storage: 'sbfile:' links open through a short-lived signed link */
async function sbUrl(u) {
  if (!/^sbfile:/.test(String(u))) return u;
  const r = await fetch(window.V2.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: window.V2.token, action: '__file', path: u }) });
  const j = await r.json(); if (j.error) throw j.error; return j.url;
}
(function () {
  const _open = window.open.bind(window);
  window.open = function (u, n, f) {
    if (/^sbfile:/.test(String(u || ''))) { const w = _open('', n || '_blank', f); sbUrl(u).then(x => { if (w) w.location.href = x; else _open(x, '_blank'); }).catch(e => { try { w && w.close(); } catch (_) {} toast(String(e)); }); return w; }
    return _open(u, n, f);
  };
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href^="sbfile:"]'); if (!a) return; e.preventDefault(); window.open(a.getAttribute('href'), '_blank'); }, true);
})();
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 2600); }
function setLang(l) { LANG = l; try { localStorage.setItem(window.ROLE === 'assistant' ? 'rh_lang_a' : 'rh_lang', l); } catch (e) {} paintChrome(); render(); }
document.getElementById('lang-pt').onclick = () => setLang('pt');
document.getElementById('lang-en').onclick = () => setLang('en');

function paintChrome() {
  document.title = t('app');
  document.getElementById('appTitle').textContent = t('app');
  document.getElementById('lang-pt').className = LANG === 'pt' ? 'on' : '';
  document.getElementById('lang-en').className = LANG === 'en' ? 'on' : '';
  const pend = (CACHE.month ? CACHE.month.rows.filter(r => r[6] === 'Verificar').length : 0) + NEWP.length;
  const nreq = window.NREQ || 0;
  document.getElementById('alert').innerHTML = NEWP.length ? '<div class="alertbar">⚠ ' + NEWP.length + ' ' + t('newHikMsg') + ': ' + NEWP.map(p => esc(p.nome || ('ID ' + p.id)) + ' (' + esc(p.dept) + ')').join(', ') + ' <button onclick="go(\'pending\')">' + t('resolveNow') + '</button></div>' : '';
  document.getElementById('nav').innerHTML = (window.ROLE === 'assistant' ? ['req'] : ['today','month','grid','approvals','leave','loans','pay','pending','people','dash','set']).map(v =>
    '<button class="' + (VIEW === v ? 'on' : '') + '" onclick="go(\'' + v + '\')">' + t(v) + (v === 'pending' && pend ? '<span class="badge">' + pend + '</span>' : '') + (v === 'approvals' && nreq ? '<span class="badge">' + nreq + '</span>' : '') + (v === 'people' && window.NDOC ? '<span class="badge">' + window.NDOC + '</span>' : '') + '</button>').join('');
}
let EDITP = true;
function go(v) { VIEW = v; F.q = ''; DAYK = ''; paintChrome(); render(); }
function loading() { document.getElementById('main').innerHTML = '<div class="load">' + t('loading') + '</div>'; }
function showErr(e) { document.getElementById('main').innerHTML = '<div class="err">' + t('error') + ': ' + esc(e) + '</div>'; }
let PEOPLE_STALE = false;
function invalidate() { CACHE = { meta: CACHE.meta }; if (window.ROLE !== 'assistant') PEOPLE_STALE = true; }

async function need(key, p) {
  const ck = key + (p ? JSON.stringify(p) : '');
  if (CACHE[ck]) return CACHE[ck];
  loading();
  CACHE[ck] = await call(key, p);
  if (key === 'month' && !(p && p.prev)) CACHE.month = CACHE[ck];
  paintChrome();
  return CACHE[ck];
}

/* data changed elsewhere (another window, phone, assistant approval, nightly sync)? refresh the screen on its own */
let DVER = null;
async function verCheck() {
  if (window.ROLE === 'assistant' || document.hidden) return;
  try {
    const r = await call('ver', {});
    if (DVER !== null && r.v !== DVER) { invalidate(); const m = document.getElementById('modal'); if (!(m && m.classList.contains('on'))) render(); }
    DVER = r.v;
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) verCheck(); });
window.addEventListener('focus', () => verCheck());
setInterval(verCheck, 60000); setTimeout(verCheck, 3000);

const coCode = ent => { const s = String(ent || '').trim(); return /^cpcm/i.test(s) ? 'CP' : /^k\s*import/i.test(s) ? 'KI' : /^galer/i.test(s) ? 'GM' : ''; };
const coLogo = (ent, h) => { const c = coCode(ent); return c ? '<img class="colg" src="' + LOGO[c] + '" alt="" style="height:' + (h || 16) + 'px">' : ''; };
async function render() {
  try {
    if (VIEW === 'today') return (DAY2 && DAY2 > DAY) ? renderRange(await need('range', { from: DAY, to: DAY2 })) : renderDay(await need('day', { date: DAY }));
    if (VIEW === 'grid') { if (!G.from) { const m = await need('month'); G.from = m.from; G.to = m.to < todayStr() ? m.to : todayStr(); } return renderGrid(await need('range', { from: G.from, to: G.to })); }
    if (VIEW === 'month') return renderMonth(await need('month', window.MPREV ? { prev: 1 } : undefined));
    if (VIEW === 'leave') return renderLeave();
    if (VIEW === 'loans') { await peopleDL(); return renderLoans(await need('loans')); }
    if (VIEW === 'req') return renderAssist();
    if (VIEW === 'approvals') return renderApprovals(await need('requests'));
    if (VIEW === 'pay') return renderPay(await need('payroll', PAYP ? { periodo: PAYP } : undefined));
    if (VIEW === 'pending') return renderPending(await need('month'));
    if (VIEW === 'people') { const al = await need('docs'); return renderPeople(await need('people'), al); }
    if (VIEW === 'set') return renderSettings(await need('settings'));
    if (VIEW === 'dash') { const r = dashRange(); return renderDash2(await need('analytics', r)); }
  } catch (e) { showErr(e); }
}

function deptChips(rows, deptIdx) {
  const ds = [...new Set(rows.map(r => r[deptIdx]).filter(Boolean))].sort();
  return '<div class="chips">' + ['all'].concat(ds).map(d => '<span class="chip ' + (F.dept === d ? 'on' : '') + '" onclick="F.dept=\'' + esc(d) + '\';render()">' + (d === 'all' ? t('all') : esc(d)) + '</span>').join('') + '</div>';
}
const byDept = (r, i) => F.dept === 'all' || r[i] === F.dept;
const byName = (n) => !F.q || String(n).toLowerCase().indexOf(F.q.toLowerCase()) >= 0;
function searchBox() { return '<input type="search" id="q" placeholder="' + t('search') + '" value="' + esc(F.q) + '" oninput="F.q=this.value;render();setTimeout(()=>{const q=document.getElementById(\'q\');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},0)">'; }

/* ---------- Day (any date) ---------- */
let DAYK = '';
function renderDay(d) {
  const rows = d.rows.filter(r => byDept(r, 3) && byName(r[2]));
  const cnt = f => rows.filter(f).length;
  const KF = { ok: r => WORKED.indexOf(r[6]) >= 0 || (r[6] === 'Verificar' && r[4]), late: r => r[7] > 0, bad: r => r[6] === 'Falta' || r[6] === 'Por entrar', chk: r => r[6] === 'Verificar', inf: r => NOT_DUE.indexOf(r[6]) >= 0 };
  const k = [
    ['ok', t('present'), cnt(KF.ok)],
    ['late', t('lateK'), cnt(KF.late)],
    ['bad', d.isToday ? t('absentSoFar') : t('absent'), cnt(KF.bad)],
    ['chk', t('toCheck'), cnt(KF.chk)],
    ['inf', t('offLeave'), cnt(KF.inf)]
  ];
  if (DAYK && KF[DAYK]) { const f = KF[DAYK]; for (let i = rows.length - 1; i >= 0; i--) if (!f(rows[i])) rows.splice(i, 1); }
  rows.sort((a, b) => (a[6] === 'Falta') - (b[6] === 'Falta') || String(a[3]).localeCompare(b[3]) || String(a[2]).localeCompare(b[2]));
  document.getElementById('main').innerHTML =
    '<div class="bar"><b>' + dow(d.date) + ' ' + fmtDY(d.date) + '</b>' +
    rangeInputs(d.date, d.date, 'day') +
    (d.isToday ? '' : '<button class="btn sec sm" onclick="DAY=todayStr();DAY2=\'\';render()">' + t('backToday') + '</button>') +
    '<span class="muted">' + t('lastSync') + ': ' + esc(d.lastSync) + '</span><span class="sp"></span>' +
    (d.isToday ? '<button class="btn" id="rf" onclick="refreshToday()">' + t('refresh') + '</button>' : '') + '</div>' +
    '<div class="kpis">' + k.map(x => '<div class="kpi ' + x[0] + ' kclick' + (DAYK === x[0] ? ' kon' : '') + '" onclick="DAYK=DAYK===\'' + x[0] + '\'?\'\':\'' + x[0] + '\';render()" title="' + LL('Clique para ver quem', 'Click to see who') + '">' + x[1] + '<b>' + x[2] + '</b></div>').join('') + '</div>' +
    (DAYK ? '<div class="bar"><span class="st s-inf">' + LL('A mostrar: ', 'Showing: ') + (k.find(x => x[0] === DAYK) || [0, ''])[1] + ' (' + rows.length + ')</span><button class="btn sec sm" onclick="DAYK=\'\';render()">✕ ' + LL('Mostrar todos', 'Show all') + '</button></div>' : '') +
    '<div class="bar">' + deptChips(d.rows, 3) + '<span class="sp"></span>' + searchBox() + '</div>' +
    '<div class="card tw"><table><tr><th>' + t('name') + '</th><th>' + t('dept') + '</th><th>' + t('in') + '</th><th>' + t('out') + '</th><th>' + t('status') + '</th><th class="n">' + t('late') + '</th><th class="n">' + t('early') + '</th><th></th></tr>' +
    rows.map(r => '<tr><td class="click" onclick="openPerson(' + r[1] + ')"><b>' + esc(r[2]) + '</b></td><td>' + esc(r[3]) + '</td><td>' + hm(r[4]) + '</td><td>' + hm(r[5]) + '</td><td>' +
      ((r[6] === 'Falta' || r[6] === 'Por entrar') && d.isToday ? '<span class="st s-bad">' + t('absentSoFar') + '</span>' : stTag(r[6]) + (/Em serviço/.test(r[11] || '') ? ' <small class="muted">' + LL('em serviço', 'at work') + '</small>' : '')) + '</td><td class="n">' + (r[7] || '') + '</td><td class="n">' + (r[8] || '') +
      '</td><td><button class="btn sec sm" onclick="openPerson(' + r[1] + ',\'' + r[0] + '\')">' + t('justify') + '</button></td></tr>').join('') +
    '</table></div>';
}
async function refreshToday() {
  const b = document.getElementById('rf'); b.disabled = true; b.textContent = t('loading');
  try { const d = await call('today', { refresh: true }); invalidate(); CACHE['day' + JSON.stringify({ date: DAY })] = { date: d.date, isToday: true, lastSync: d.lastSync, rows: d.rows }; render(); } catch (e) { showErr(e); }
}

/* ---------- Month ---------- */
function summarize(rows) {
  const m = {};
  rows.forEach(r => {
    const s = m[r[1]] = m[r[1]] || { id: r[1], nome: r[2], dept: r[3], due: 0, worked: 0, abs: 0, lateN: 0, lateM: 0, earlyN: 0, earlyM: 0, chk: 0, extra: 0 };
    if (NOT_DUE.indexOf(r[6]) < 0) s.due++;
    if (WORKED.indexOf(r[6]) >= 0) s.worked++;
    if (ABS.indexOf(r[6]) >= 0) s.abs++;
    if (r[6] === 'Verificar') s.chk++;
    if (r[7] > 0) { s.lateN++; s.lateM += r[7]; }
    if (r[8] > 0) { s.earlyN++; s.earlyM += r[8]; }
    s.extra += r[10] || 0;

}

/* ---------- Dashboard ---------- */
function renderDash(d) {
  const rows = d.rows.filter(r => byDept(r, 3));
  const sum = summarize(rows);
  const due = sum.reduce((a, s) => a + s.due, 0), worked = sum.reduce((a, s) => a + s.worked, 0);
  const abs = sum.reduce((a, s) => a + s.abs, 0), lateM = sum.reduce((a, s) => a + s.lateM, 0), chk = sum.reduce((a, s) => a + s.chk, 0);
  const rate = due ? Math.round(worked / due * 1000) / 10 : 0;
  const bars = (list, key, fmt) => { const mx = Math.max(1, ...list.map(x => x[key])); return list.map(x => '<div class="hb"><span class="l">' + esc(x.nome) + '</span><span class="t"><span class="f" style="display:block;width:' + (x[key] / mx * 100) + '%"></span></span><span class="v">' + fmt(x[key]) + '</span></div>').join('') || '<div class="load">' + t('none') + '</div>'; };
  const topLate = sum.filter(s => s.lateM).sort((a, b) => b.lateM - a.lateM).slice(0, 8);
  const topAbs = sum.filter(s => s.abs).sort((a, b) => b.abs - a.abs).slice(0, 8);
  const days = [...new Set(rows.map(r => r[0]))].sort();
  const perDay = days.map(x => ({ d: x, v: rows.filter(r => r[0] === x && ABS.indexOf(r[6]) >= 0).length }));
  const mxd = Math.max(1, ...perDay.map(x => x.v));
  const depts = [...new Set(d.rows.map(r => r[3]))].sort().map(dp => { const s = summarize(d.rows.filter(r => r[3] === dp)); const du = s.reduce((a, x) => a + x.due, 0), w = s.reduce((a, x) => a + x.worked, 0); return { nome: dp, v: du ? Math.round(w / du * 1000) / 10 : 0 }; });

/* filter a person list by company + typed text (accents ignored); picks the match when only one is left */
function ppF(idAttr) {
  const s = document.getElementById(idAttr); if (!s) return;
  const norm = x => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const e = val(idAttr + '_e'), q = norm(val(idAttr + '_q')), cur = s.value;
  const list = (PEOPLE_DL || []).slice().sort((a, b) => a.id - b.id).filter(p => (!e || p.ent === e) && (!q || norm(p.label).indexOf(q) >= 0));
  s.innerHTML = '<option value="">— ' + t('choose') + ' (' + list.length + ') —</option>' + list.map(p => '<option value="' + p.id + '"' + (String(p.id) === cur ? ' selected' : '') + '>' + esc(p.label) + '</option>').join('');
  if (list.length === 1) s.value = String(list[0].id);
  if (s.value !== cur) s.dispatchEvent(new Event('change', { bubbles: true }));
}

/* ---------- File → compressed base64 ---------- */
function readDoc(input) {
  return new Promise((res, rej) => {
    const f = input.files && input.files[0]; if (!f) return rej(t('photo'));
    if (f.type === 'application/pdf') {
      if (f.size > 8e6) return rej('PDF > 8 MB');
      const fr = new FileReader(); fr.onload = () => res({ mime: 'application/pdf', b64: String(fr.result).split(',')[1] }); fr.onerror = rej; fr.readAsDataURL(f); return;
    }
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res({ mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.75).split(',')[1] }); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(f);
  });
}

function payDetail(id) {
  const d = window._pay, r = d.rows.filter(x => x.id === id)[0]; if (!r) return;
  const line = (lbl, val2, q, neg) => val2 || q ? '<tr><td>' + lbl + (q ? ' <span class="muted">' + q + '</span>' : '') + '</td><td class="n">' + (neg && val2 ? '−' : '') + money(val2) + '</td></tr>' : '';
  const vBase = Math.round(r.base / 30 * r.ef * 100) / 100;
  const earn = line(t('pBase'), vBase, r.ef !== 30 ? money(r.base) + ' ÷ 30 × ' + r.ef + ' ' + t('pDays') : '') + line(t('pOT'), r.vHE, r.heH ? r.heH + ' h' + (r.heDom ? ' (' + r.heDom + ' h ' + t('pSun') + ')' : '') : '') + line(t('pOther'), r.outras, '') +
    line(t('pLP'), r.vFP, r.fpDias ? r.fpDias + ' ' + t('pDays') : '') + line(t('pBonus'), r.bonus, '') + line(t('pAllow'), r.subs, '');
  const deds = line(t('pAbs'), r.vFaltas, r.faltas ? r.faltas + ' ' + t('pDays') : '', true) + line(t('pLate'), r.vAtraso, r.lateMin ? r.lateMin + ' min' : '', true) + line(t('pInss'), r.inss, '', true) + line(t('pAdv'), r.loans, '', true) + line(t('pOth'), r.outros, '', true);
  const xp = payExtra(r);
  const debt = r.saldoAnt || r.contraida || r.loans || r.saldoAtual ? '<div class="info">' + [[t('pPrev'), r.saldoAnt], [t('pNewD'), r.contraida], [t('pAdv'), r.loans]].concat(xp.map(x => [LL(x[0], x[1]), x[2]])).concat([[t('pBal'), r.saldoAtual]]).map(x => '<div><small>' + x[0] + '</small>' + money(x[1]) + '</div>').join('') + '</div>' : '';
  const inp = (k, lbl, v, ph) => '<label>' + lbl + '<input type="number" step="0.01" id="pm_' + k + '" value="' + (v === 0 || v ? v : '') + '"' + (ph ? ' placeholder="' + ph + '"' : '') + '></label>';
  modal(r.nome + ' · ' + d.periodo, '<button class="btn sm" onclick="printReceipts([' + r.id + '])">' + t('pSlip') + '</button>',
    '<div class="info"><div><small>' + t('pCompany') + '</small>' + coLogo(r.ent, 22) + esc(r.ent) + '</div><div><small>' + t('name') + '</small>' + esc(r.nome) + '</div><div><small>ID</small>' + r.id + '</div><div><small>' + t('dept') + '</small>' + esc(r.dept) + '</div>' +
    '<div><small>' + t('period') + '</small>' + fmtDY(d.from) + ' → ' + fmtDY(d.to) + '</div><div><small>' + t('pEf') + '</small>' + r.ef + '</div></div>' +
    '<div class="grid2" style="padding:0 14px"><div class="card"><h3>' + t('pEarn') + '</h3><table>' + earn + '<tr><th>' + t('pGross') + '</th><th class="n">' + money(r.bruto) + '</th></tr></table></div>' +
    '<div class="card"><h3>' + t('pDeds') + '</h3><table>' + (deds ? deds + '<tr><th>' + t('pTotD') + '</th><th class="n">−' + money(r.descontos) + '</th></tr>' : '<tr><td class="muted">—</td><td></td></tr>') + '<tr><th>' + t('pNet') + '</th><th class="n" style="font-size:16px">' + money(r.liquido) + '</th></tr></table></div></div>' +
    debt +
    (r.nota ? '<div class="info"><div style="grid-column:1/-1"><small>' + t('notes') + '</small>' + esc(r.nota) + '</div></div>' : '') +
    
    (d.closed ? '' : '<div class="card noprint" style="margin:12px 14px"><h3>' + t('pManual') + '</h3><div class="form">' + inp('bonus', t('pBonus'), r.bonus) + inp('subs', t('pAllow'), r.subs) + inp('ef', t('pEf'), r.efMan, t('pEfH')) + inp('outros', t('pOth'), r.outros) + 
      inp('faltas', LL('Dias de faltas', 'Absence days'), r.faltasMan, (r.faltasAuto || 0) + ' · ' + t('pAutoW')) + inp('atraso', LL('Minutos de atraso', 'Late minutes'), r.atrasoMan, (r.lateAuto || 0) + ' · ' + t('pAutoW')) +
      '<label>' + t('role') + '<select id="pm_func"><option value="">—</option>' + (d.funcs || []).concat(r.func && (d.funcs || []).indexOf(r.func) < 0 ? [r.func] : []).map(f => '<option' + (f === r.func ? ' selected' : '') + '>' + esc(f) + '</option>').join('') + '</select></label>' +
    '<label class="full">' + t('notes') + '<input id="pm_nota" value="' + esc(r.nota) + '"></label><div class="act"><button class="btn" id="pm_b" onclick="paySave(' + r.id + ')">' + t('save') + '</button></div></div></div>') +
    '<div class="sig"><div>' + t('signEmp') + '</div><div>' + t('pSigC') + '</div></div>');

async function paySave(id) {
  const d = window._pay, r = d.rows.filter(x => x.id === id)[0];
  document.getElementById('pm_b').disabled = true;
  try {
    await call('paySave', { periodo: d.periodo, id: id, nome: r.nome, bonus: val('pm_bonus'), subs: val('pm_subs'), ef: val('pm_ef'), outros: val('pm_outros'), nota: val('pm_nota'), inss: '', faltas: val('pm_faltas'), atraso: val('pm_atraso'), func: val('pm_func') });
    invalidate(); toast(t('saved')); await render(); payDetail(id);
  } catch (e) { toast(t('error') + ': ' + e); document.getElementById('pm_b').disabled = false; }
}
async function payClose() {
  const d = window._pay;
  try {
    const c = await call('payClose', { periodo: d.periodo, check: true });
    if (c.hard.length) return alert(t('pCant') + '\n• ' + c.hard.map(payWarn).join('\n• '));
    if (!confirm((c.soft.length ? t('pWarn') + '\n• ' + c.soft.map(payWarn).join('\n• ') + '\n\n' : '') + t('pCloseQ'))) return;
    await call('payClose', { periodo: d.periodo }); invalidate(); PAYP = d.periodo; toast(t('saved')); render();
  } catch (e) { toast(t('error') + ': ' + e); }
}
async function payReopen() {
  const d = window._pay; if (!confirm(t('pReopenQ'))) return;
  try { await call('payReopen', { periodo: d.periodo }); invalidate(); toast(t('saved')); render(); } catch (e) { toast(t('error') + ': ' + e); }
}
async function payExport() {

const MES_PT = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
function rcpHtml(r, via) {
  const d = window._pay, e = (d.empresas || {})[r.ent || '—'] || { nome: r.ent || '', morada: '', nuit: '' };
  const m = x => money(x);
  const q = s => '<i>' + s + '</i>';
  const L = [['Sal. base', q(r.ef + ' dias'), Math.round(r.base / 30 * r.ef * 100) / 100], ['H. extra', q((r.heH || 0) + ' h'), r.vHE], ['Outras rem.', '', r.outras]];
  if (r.vFP) L.push(['Férias pagas', q(r.fpDias + ' dias'), r.vFP]);
  if (r.bonus) L.push(['Bónus', '', r.bonus]);
  if (r.subs) L.push(['Subsídios', '', r.subs]);
  const R = [['Faltas', q((r.faltas || 0) + ' dias'), r.vFaltas], ['Atrasos', q((r.lateMin || 0) + ' min'), r.vAtraso], ['INSS', q(((d.cfg && d.cfg.a) || 3) + '%'), r.inss], ['Desc. dívida', '', r.loans], ['Outros', '', r.outros]];
  while (L.length < R.length) L.push(['', '', '']); while (R.length < L.length) R.push(['', '', '']);
  const cell = x => '<td>' + x[0] + ' ' + x[1] + '</td><td class="v">' + (x[0] ? m(x[2]) : '') + '</td>';
  const pk = d.periodo, mes = MES_PT[Number(pk.slice(5, 7)) - 1] + ' ' + pk.slice(0, 4);
  const lg = coCode(r.ent), xp = payExtra(r);
  return '<div class="rc"><div class="rh">' + (lg ? '<img class="rlg" src="' + LOGO[lg] + '" alt="">' : '') + '<div class="re"><b>' + esc(e.nome) + '</b>' + (e.morada ? '<br>' + esc(e.morada) : '') + (e.nuit ? '<br>NUIT ' + esc(e.nuit) : '') + '</div>' +
    '<div class="rw"><span>ID ' + r.id + '</span><b>' + esc(r.nome) + '</b><span>RECIBO DE SALÁRIO · ' + mes + '</span><small>' + fmtDY(d.from) + ' a ' + fmtDY(d.to) + (via ? ' · Via ' + via : '') + '</small></div></div>' +
    '<table class="rt"><colgroup><col style="width:30%"><col style="width:20%"><col style="width:30%"><col style="width:20%"></colgroup><tr><th colspan="2">PROVEITOS</th><th colspan="2">DESCONTOS</th></tr>' + L.map((x, i) => '<tr>' + cell(x) + cell(R[i]) + '</tr>').join('') +
    '<tr class="rs"><td>TOTAL BRUTO</td><td class="v">' + m(r.bruto) + '</td><td>TOTAL DESCONTOS</td><td class="v">' + m(r.descontos) + '</td></tr>' +
    '<tr><td>Saldo anterior</td><td class="v">' + m(r.saldoAnt) + '</td><td rowspan="' + (3 + xp.length) + '" colspan="2" class="rl">LÍQUIDO A RECEBER<b>' + m(r.liquido) + ' MT</b></td></tr>' +
    '<tr><td>Dívida contraída</td><td class="v">' + m(r.contraida) + '</td></tr>' + xp.map(x => '<tr><td>' + x[0] + '</td><td class="v">' + m(x[2]) + '</td></tr>').join('') + '<tr><td>Saldo actual</td><td class="v">' + m(r.saldoAtual) + '</td></tr></table>' +
    '<div class="rf">Datas de faltas: ' + esc(r.datasFaltas || '—') + '</div><div class="rsig"><div>Entidade pagadora</div><div>Trabalhador(a)</div></div></div>';
}
/* debt paid outside the salary this period: [label pt, label en, value] */
function payExtra(r) {
  const fp = Number(r.pagoFP) || 0, dir = Number(r.pagoDir) || 0, out = [];
  if (r.pagoFP !== undefined || r.pagoDir !== undefined) { if (fp > 0.004) out.push(['Pago com férias pagas', 'Paid with leave pay-out', fp]); if (dir > 0.004) out.push(['Pagamento direto', 'Direct payment', dir]); return out; }
  const gap = Math.round(((Number(r.saldoAnt) || 0) + (Number(r.contraida) || 0) - (Number(r.loans) || 0) - (Number(r.saldoAtual) || 0)) * 100) / 100;   // closed periods: derived
  if (gap > 0.5) out.push(['Outros pagamentos', 'Other payments', gap]);
  return out;
}
function printReceipts(ids) {
  const d = window._pay; if (!d) return;
  const list = ids ? d.rows.filter(r => ids.indexOf(r.id) >= 0) : payRows();
  if (!list.length) return toast(t('pNone'));
  const items = [];
  list.forEach(r => { if (PAYDUP) { items.push([r, 'do trabalhador']); items.push([r, 'da empresa']); } else items.push([r, '']); });
  let html = '';
  for (let i = 0; i < items.length; i += 6) html += '<div class="rp">' + items.slice(i, i + 6).map(x => rcpHtml(x[0], x[1])).join('') + '</div>';
  let box = document.getElementById('rcp');
  if (!box) { box = document.createElement('div'); box.id = 'rcp'; document.body.appendChild(box); }
  box.innerHTML = html; printWith('rcpm', () => { box.innerHTML = ''; }, (list.length === 1 ? 'Recibo - ' + list[0].nome : 'Recibos') + ' - ' + d.periodo);
}


/* ---------- Phase 7: lists, documents, day off, pay rule ---------- */
const WD_PT = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
Object.assign(T.pt, { wdNames: WD_PT, payRule:'Regra salarial', prAuto:'Automática (pela empresa)', prStd:'Padrão — base ÷ 180', prGal:'Gallery — base ÷ 192', contractEnd:'Fim de contrato',
  manageLists:'Gerir listas', lists:'Listas', listsHint:'Estas listas alimentam os formulários. Mudar um nome atualiza todas as pessoas que o usam.', ls_ent:'Empresas', ls_dept:'Departamentos', ls_loc:'Localizações', ls_func:'Funções', ls_doc:'Tipos de documento',
  rename:'Mudar nome', remove:'Remover', newItem:'Novo item…', updatedN:'atualizados', docs:'Documentos', addDoc:'+ Documento', docNo:'Número', expiry:'Validade', docFile:'Foto / PDF',
  dExp:'Expirado', dSoon:'Expira em breve', dOk:'Válido', dNoExp:'Sem validade', noDocs:'Sem documentos', noLicence:'Motorista sem carta de condução válida registada', noLicShort:'Sem carta',
  docAlerts:'Documentos e contratos a tratar', ctEnd:'Contrato termina', ctEnded:'Contrato terminou', dView:'Ver', delDocQ:'Apagar este documento? O ficheiro também é apagado.', pRecalc:'Recalcular', back:'← Voltar' });
Object.assign(T.en, { wdNames: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'], payRule:'Pay rule', prAuto:'Automatic (by company)', prStd:'Standard — base ÷ 180', prGal:'Gallery — base ÷ 192', contractEnd:'Contract end',
  manageLists:'Manage lists', lists:'Lists', listsHint:'These lists feed the forms. Renaming an item updates everyone who uses it.', ls_ent:'Companies', ls_dept:'Departments', ls_loc:'Locations', ls_func:'Roles', ls_doc:'Document types',
  rename:'Rename', remove:'Remove', newItem:'New item…', updatedN:'updated', docs:'Documents', addDoc:'+ Document', docNo:'Number', expiry:'Expiry', docFile:'Photo / PDF',
  dExp:'Expired', dSoon:'Expiring soon', dOk:'Valid', dNoExp:'No expiry', noDocs:'No documents', noLicence:'Driver without a valid driving licence on file', noLicShort:'No licence',
  docAlerts:'Documents and contracts to handle', ctEnd:'Contract ends', ctEnded:'Contract ended', dView:'View', delDocQ:'Delete this document? The file is deleted too.', pRecalc:'Recalculate', back:'← Back' });
document.head.insertAdjacentHTML('beforeend', '<style>.alist{margin:0;padding:8px 14px 12px 32px;columns:2;column-gap:28px}.alist li{padding:3px 0;break-inside:avoid}' +
  '.lchips{display:flex;flex-wrap:wrap;gap:6px}.lchip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;background:#fff}.lchip a{color:var(--mut);text-decoration:none;margin-left:4px}.lchip a:hover{color:var(--pri)}' +
  '@media(max-width:700px){.alist{columns:1}}</style>');

const folgaName = v => { const i = WD_PT.indexOf(v); return i >= 0 ? T[LANG].wdNames[i] : (v || t('none')); };
const prName = v => v === 'Padrão' ? t('prStd') : v === 'Gallery' ? t('prGal') : t('prAuto');
const DOC_ST = { exp: ['bad', 'dExp'], soon: ['late', 'dSoon'], ok: ['ok', 'dOk'], none: ['off', 'dNoExp'] };
const isDriverC = f => /^drv$|motor|driver|condutor/i.test(String(f || '').trim());
const isLicenceC = tp => /carta|licen|driv/i.test(String(tp || ''));

function docsCard(list) {
  const noLic = isDriverC(CUR.p.func) && !list.some(d => isLicenceC(d.tipo) && d.st !== 'exp');
  return '<div class="card" style="margin:0 14px 12px"><h3>' + t('docs') + '<span class="sp"></span>' + (EDITP ? '<button class="btn sec sm" onclick="docForm()">' + t('addDoc') + '</button>' : '') + '</h3><div id="dinl"></div>' +
    (noLic ? '<div class="err" style="margin:10px 14px">⚠ ' + t('noLicence') + '</div>' : '') +
    (list.length ? '<table><tr><th>' + t('type') + '</th><th>' + t('docNo') + '</th><th>' + t('expiry') + '</th><th></th><th></th></tr>' + list.map(d =>
      '<tr><td>' + esc(d.tipo) + '</td><td>' + esc(d.num) + '</td><td>' + (d.val ? fmtDY(d.val) : '—') + '</td><td><span class="st s-' + DOC_ST[d.st][0] + '">' + t(DOC_ST[d.st][1]) + '</span></td><td style="text-align:right;white-space:nowrap">' +
      (d.hasFile ? '<button class="btn sec sm" onclick="viewPDoc(' + d.n + ')">' + t('dView') + '</button> ' : '') + (EDITP ? '<button class="btn sec sm" onclick="docForm(' + d.n + ')">' + t('edit') + '</button> <button class="btn sec sm" onclick="docDel(' + d.n + ')">×</button>' : '') + '</td></tr>').join('') + '</table>'
      : '<div class="muted" style="padding:12px 14px">' + t('noDocs') + '</div>') + '</div>';
}
async function docForm(n) {
  const meta = CACHE.meta || (CACHE.meta = await call('meta'));
  const d = n ? ((CUR.d.docs || []).filter(x => x.n === n)[0] || {}) : {};
  const types = (meta.doc || []).slice(); if (d.tipo && types.indexOf(d.tipo) < 0) types.push(d.tipo);
  const el = document.getElementById('dinl');
  el.innerHTML = '<div class="inline"><b>' + (n ? t('edit') : t('addDoc').replace('+ ', '')) + '</b>' +
    '<select id="dt">' + types.map(x => '<option' + (x === d.tipo ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>' +
    '<input id="dnum" placeholder="' + t('docNo') + '" value="' + esc(d.num || '') + '" style="width:150px">' +
    '<label class="muted">' + t('expiry') + ' <input type="date" id="dval" value="' + esc(d.val || '') + '"></label>' +
    '<label class="muted">' + t('docFile') + ' <input type="file" id="dfile" accept="image/*,application/pdf"></label>' +
    '<input id="dnot" placeholder="' + t('note') + '" value="' + esc(d.notas || '') + '" style="flex:1;min-width:140px">' +
    '<button class="btn" id="dbtn" onclick="docSave(' + (n || 0) + ')">' + t('save') + '</button><button class="btn sec" onclick="document.getElementById(\'dinl\').innerHTML=\'\'">' + t('cancel') + '</button></div>';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
async function docSave(n) {
  const b = document.getElementById('dbtn'); b.disabled = true; b.textContent = t('loading');
  try {
    const fi = document.getElementById('dfile'); let file = null;
    if (fi.files && fi.files[0]) file = await readDoc(fi);
    await call('docSave', { n: n || '', id: CUR.p.id, tipo: val('dt'), num: val('dnum'), val: val('dval'), notas: val('dnot'), file: file });
    toast(t('saved')); delete CACHE.docs; refreshDocBadge(); openPerson(CUR.p.id);
  } catch (e) { toast(t('error') + ': ' + e); b.disabled = false; b.textContent = t('save'); }
}
async function docDel(n) {
  if (!confirm(t('delDocQ'))) return;
  try { await call('docDelete', { n: n }); toast(t('saved')); delete CACHE.docs; refreshDocBadge(); openPerson(CUR.p.id); } catch (e) { toast(t('error') + ': ' + e); }
}
async function refreshDocBadge() { try { const a = await call('docs'); window.NDOC = a.count; CACHE.docs = a; paintChrome(); } catch (e) {} }
async function viewPDoc(n) {
  const back = '<button class="btn sec sm" onclick="openPerson(' + CUR.p.id + ')">' + t('back') + '</button> ';
  modal(t('loading'));
  try {
    const f = await call('docFile', { n: n }); const src = 'data:' + f.mime + ';base64,' + f.b64;
    modal(f.name, back + '<a class="btn sec sm" href="' + f.url + '" target="_blank" rel="noopener">' + t('openDrive') + '</a>',
      f.mime.indexOf('image') === 0 ? '<div style="padding:12px;text-align:center"><img src="' + src + '" style="max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px"></div>' : '<iframe src="' + src + '" style="width:100%;height:75vh;border:0"></iframe>');
  } catch (e) { modal(t('error'), back, '<div class="err" style="margin:14px">' + esc(e) + '</div>'); }
}
function docAlertsHtml(al) {
  if (!al || !al.count) return '';
  const li = (id, tag, txt) => '<li class="click" onclick="openPerson(' + id + ')">' + tag + ' ' + txt + '</li>';
  const it = [];
  al.drivers.forEach(x => it.push(li(x.id, '<span class="st s-bad">' + t('noLicShort') + '</span>', esc(x.nome))));
  al.alerts.forEach(d => it.push(li(d.id, '<span class="st s-' + (d.st === 'exp' ? 'bad' : 'late') + '">' + t(d.st === 'exp' ? 'dExp' : 'dSoon') + ' ' + fmtDY(d.val) + '</span>', esc(d.nome) + ' · ' + esc(d.tipo))));
  al.contracts.forEach(c => it.push(li(c.id, '<span class="st s-' + (c.st === 'exp' ? 'bad' : 'late') + '">' + t(c.st === 'exp' ? 'ctEnded' : 'ctEnd') + ' ' + fmtDY(c.fim) + '</span>', esc(c.nome))));
  return '<div class="card" style="border-color:var(--late)"><h3>⚠ ' + t('docAlerts') + ' (' + al.count + ')</h3><ul class="alist">' + it.join('') + '</ul></div>';
}

function listsPaint() {

  document.getElementById('mBody').innerHTML = '<div class="muted" style="padding:12px 14px">' + t('listsHint') + '</div>' + ['ent', 'dept', 'loc', 'func', 'doc'].map(k =>
    '<div class="card" style="margin:0 14px 10px"><h3>' + t('ls_' + k) + ' <span class="muted">(' + x.lists[k].length + ')</span></h3><div style="padding:10px 14px" class="lchips">' +
    x.lists[k].map((v, i) => '<span class="lchip">' + esc(v) + '<a href="#" title="' + t('rename') + '" onclick="listRen(\'' + k + '\',' + i + ');return false">✎</a><a href="#" title="' + t('remove') + '" onclick="listDel(\'' + k + '\',' + i + ');return false">×</a></span>').join('') +
    '</div><div class="inline" style="margin:0 14px 12px"><input id="la_' + k + '" placeholder="' + t('newItem') + '" style="flex:1" onkeydown="if(event.key===\'Enter\')listAdd(\'' + k + '\')"><button class="btn sm" onclick="listAdd(\'' + k + '\')">' + t('add') + '</button></div></div>').join('');
}
async function listOp(k, action, value, newValue) {
  try {
    const r = await call('listSave', { lkey: k, action: action, value: value, newValue: newValue || '' });
    window._lists.lists = r.lists; CACHE.meta = null; invalidate();
    toast(t('saved') + (r.changed ? ' · ' + r.changed + ' ' + t('updatedN') : '')); listsPaint();
  } catch (e) { toast(t('error') + ': ' + e); }
}
function listAdd(k) { const v = val('la_' + k).trim(); if (v) listOp(k, 'add', v); }
function listRen(k, i) { const v = window._lists.lists[k][i]; const nv = prompt(t('rename') + ': ' + v, v); if (nv && nv.trim() && nv.trim() !== v) listOp(k, 'rename', v, nv.trim()); }
function listDel(k, i) { const v = window._lists.lists[k][i]; if (confirm(t('remove') + ': ' + v + '?')) listOp(k, 'remove', v); }

  loading();
  try {
    const d = await call('payroll', { periodo: window._pay.periodo, fresh: true });
    CACHE = { meta: CACHE.meta }; CACHE['payroll' + (PAYP ? JSON.stringify({ periodo: PAYP }) : '')] = d; renderPay(d);
  } catch (e) { showErr(e); }
}

paintChrome();

render();
